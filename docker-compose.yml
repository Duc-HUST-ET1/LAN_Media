services:
  lan-media:
    image: node:22-alpine
    depends_on:
      mysql:
        condition: service_healthy
    working_dir: /app
    volumes:
      - .:/app
      - lan_media_node_modules:/app/node_modules
    ports:
      - "3000:3000"
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-lan_media}
      DB_USER: ${DB_USER:-lan_media_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      FRONTEND_ORIGIN: http://localhost:5173

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-lan_media}
      MYSQL_USER: ${DB_USER:-lan_media_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_root_me}
    ports:
      - "${MYSQL_PUBLISHED_PORT:-3307}:3306"
    volumes:
      - lan_media_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lan_media_node_modules:
  lan_media_mysql_data:

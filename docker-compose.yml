services:
  lan-media:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - lan_media_node_modules:/app/node_modules
    ports:
      - "3000:3000"
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    environment:
      HOST: 0.0.0.0
      PORT: 3000

volumes:
  lan_media_node_modules:
